<title>MGGE HTML</title>
<style>
/*
VOICE: quiet utility, gets out of the way
IDEA: a magnifying glass laid over a page
PICTURE: the opened file itself, full screen; one round lens button
COLOUR and TYPE: night ink #0e1424, white, one signal orange #ff5a3c; system font
LAYOUT: start screen = one centred action; viewer = edge to edge, no bars
*/
:root{color-scheme:light dark;
  --bg:light-dark(#f4f5f8,#0e1424);--ink:light-dark(#0e1424,#eef1f7);--muted:light-dark(#5b6478,#9aa3b8);
  --panel:light-dark(rgba(255,255,255,.92),rgba(22,30,50,.92));--line:light-dark(rgba(14,20,36,.12),rgba(255,255,255,.14));
  --accent:#ff5a3c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,label.btn{font:inherit;color:inherit;cursor:pointer}

/* start screen */
#start{position:fixed;inset:0;display:grid;place-items:center;padding:24px;overflow:auto}
#start.drag{outline:3px dashed var(--accent);outline-offset:-14px}
.card{width:min(420px,100%);text-align:center}
.lens{width:132px;height:132px;margin:0 auto 22px;display:block}
h1{font-size:34px;line-height:1.05;margin:0 0 10px;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;border:0}
.btn:focus-visible,.fab:focus-visible,.pbtn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.tip{margin-top:26px;font-size:13px;color:var(--muted)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* viewer */
#stage{position:fixed;inset:0;overflow:hidden;background:#fff;display:none;--s:1}
#stage.on{display:block}
#frame{position:absolute;top:0;left:0;border:0;display:block;background:#fff;
  width:calc(100% / var(--s));height:calc(100% / var(--s));transform:scale(var(--s));transform-origin:0 0}

/* Liquid Glass: tint, blur + saturation, specular rim, soft inner shade, spring on touch.
   Switches to a dark glass when the opened page is dark. */
.glass{--g-tint:rgba(255,255,255,.22);--g-ink:#1d1d1f;--g-rim:rgba(255,255,255,.9);--g-line:rgba(0,0,0,.1);--g-halo:rgba(255,255,255,.9);
  color:var(--g-ink);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%),var(--g-tint);
  -webkit-backdrop-filter:blur(7px) saturate(190%) brightness(1.06);backdrop-filter:blur(7px) saturate(190%) brightness(1.06);
  box-shadow:inset 0 1.5px .5px var(--g-rim),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.5),
    inset 0 -12px 20px -12px rgba(0,0,0,.18),0 8px 26px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);opacity:.7}
body.dk .glass{--g-tint:rgba(40,40,46,.38);--g-ink:#f5f5f7;--g-rim:rgba(255,255,255,.45);--g-line:rgba(255,255,255,.14);--g-halo:rgba(0,0,0,.6)}
body.dk .glass::before{opacity:.25}

/* lens button */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;border:0;display:none;place-items:center;z-index:10;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.fab.on{display:grid}.fab:active,body.open .fab{transform:scale(1.1)}
.fab svg{position:relative;width:25px;height:25px;filter:drop-shadow(0 0 1.5px var(--g-halo))}

/* scale panel */
#shield{position:fixed;inset:0;z-index:11;display:none}
#panel{position:fixed;z-index:12;right:calc(18px + env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));
  width:min(300px,calc(100vw - 36px));padding:16px;border-radius:30px;display:none;transform-origin:100% 100%;
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  --g-tint:rgba(250,250,252,.62)}
body.dk #panel{--g-tint:rgba(30,30,34,.5)}
#panel>*{position:relative}
.open #shield,.open #panel{display:block}
.open #panel{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@media(prefers-reduced-motion:reduce){.open #panel{animation:none}.fab{transition:none}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pbtn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(127,127,127,.16);font-size:22px;line-height:1;display:grid;place-items:center}
#val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--accent);height:28px}
#width{font-size:13px;opacity:.65;text-align:center;margin:0 0 12px;white-space:nowrap}
.chips{display:flex;gap:8px}
.chip{flex:1;min-height:44px;border-radius:999px;border:0;background:rgba(127,127,127,.16);font-size:15px;font-weight:600}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.other{margin-top:10px;width:100%;min-height:44px;border-radius:999px;border:0;background:transparent;opacity:.7;font-size:15px}
</style>
</head>

      <circle cx="62" cy="60" r="27" fill="var(--bg)" fill-opacity=".55" stroke="var(--ink)" stroke-width="9"/>
      <path d="M54 52l-8 8 8 8M70 52l8 8-8 8" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M82 80l22 22" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"/>
    </svg>
    <h1>HTML ansehen</h1>
    <p class="sub">Öffne eine HTML-Datei aus deinen Dateien. Sie wird nur angezeigt, nichts wird hochgeladen oder gespeichert.</p>
    <label class="btn" for="file">Datei öffnen</label>
    <input id="file" type="file" accept=".html,.htm,.xhtml,text/html">
    <p class="tip">Tipp: In Safari über Teilen → „Zum Home-Bildschirm“ als App ablegen.</p>
  </div>
</section>

<div id="stage"><iframe id="frame" title="Geöffnete Datei" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe></div>

<button class="fab glass" id="fab" aria-label="Skalierung einstellen" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 10.5h5M10.5 8v5"/></svg>
</button>
<div id="shield"></div>
<div id="panel" class="glass" role="dialog" aria-label="Skalierung">
  <div class="row">
    <button class="pbtn" id="minus" aria-label="Kleiner">−</button>
    <span id="val">100 %</span>
    <button class="pbtn" id="plus" aria-label="Größer">+</button>
  </div>
  <input type="range" id="range" min="25" max="200" step="5" value="100" aria-label="Skalierung in Prozent">
  <p id="width">Seitenbreite 400 px</p>
  <div class="chips">
    <button class="chip" id="pNormal">Normal</button>
    <button class="chip" id="pLaptop">Laptop</button>
  </div>
  <button class="other" id="other">Andere Datei öffnen</button>
</div>

<script>
{
  const $ = id => document.getElementById(id);
  const start = $('start'), stage = $('stage'), frame = $('frame'), fab = $('fab'), input = $('file');
  const range = $('range'), val = $('val'), widthEl = $('width');
  const LAPTOP = 1280;
  let s = 1, preset = 'normal';

  const laptopScale = () => Math.max(.25, Math.min(1, innerWidth / LAPTOP));

  function render() {
    stage.style.setProperty('--s', s);
    const pct = Math.round(s * 100);
    val.textContent = pct + ' %';
    range.value = Math.max(25, Math.min(200, pct));
    widthEl.textContent = 'Seitenbreite ' + Math.round(innerWidth / s) + ' px';
    $('pNormal').classList.toggle('sel', preset === 'normal');
    $('pLaptop').classList.toggle('sel', preset === 'laptop');
  }
  function setScale(v, p) { s = Math.max(.25, Math.min(2, v)); preset = p || 'custom'; render(); }

  // folding, unfolding and rotating change the viewport: keep the chosen mode
  addEventListener('resize', () => { if (preset === 'laptop') s = laptopScale(); render(); });

  async function openFile(f) {
    if (!f) return;
    let text = '';
    try { text = await f.text(); } catch (e) { text = '<p style="font:16px system-ui;padding:24px">Datei konnte nicht gelesen werden.</p>'; }
    frame.srcdoc = text;
    document.title = f.name.replace(/\.x?html?$/i, '') || 'MGGE HTML';
    start.style.display = 'none';
    stage.classList.add('on');
    fab.classList.add('on');
    closePanel();
    input.value = '';
  }
  // pick light or dark glass from the opened page's background
  function tone() {
    let dark = false;
    try {
      const d = frame.contentDocument, pick = el => el && getComputedStyle(el).backgroundColor;
      let c = pick(d.body); if (!c || /rgba\(0, 0, 0, 0\)|transparent/.test(c)) c = pick(d.documentElement);
      const m = c && c.match(/\d+(\.\d+)?/g);
      if (m && (m[3] === undefined || +m[3] > .1)) dark = (.2126*m[0] + .7152*m[1] + .0722*m[2]) / 255 < .45;
    } catch (e) {}
    document.body.classList.toggle('dk', dark);
  }
  frame.addEventListener('load', () => { tone(); setTimeout(tone, 800); });

  input.addEventListener('change', () => openFile(input.files[0]));

  // drag and drop (desktop / iPad)
  ['dragenter','dragover'].forEach(t => addEventListener(t, e => { e.preventDefault(); start.classList.add('drag'); }));
  ['dragleave','drop'].forEach(t => addEventListener(t, e => { e.preventDefault(); start.classList.remove('drag'); }));
  addEventListener('drop', e => openFile(e.dataTransfer && e.dataTransfer.files[0]));

  function openPanel() { document.body.classList.add('open'); fab.setAttribute('aria-expanded','true'); render(); }
  function closePanel() { document.body.classList.remove('open'); fab.setAttribute('aria-expanded','false'); }
  fab.addEventListener('click', () => document.body.classList.contains('open') ? closePanel() : openPanel());
  $('shield').addEventListener('click', closePanel);
  addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  range.addEventListener('input', () => setScale(range.value / 100));
  $('minus').addEventListener('click', () => setScale(Math.round(s * 100 - 10) / 100));
  $('plus').addEventListener('click', () => setScale(Math.round(s * 100 + 10) / 100));
  $('pNormal').addEventListener('click', () => setScale(1, 'normal'));
  $('pLaptop').addEventListener('click', () => setScale(laptopScale(), 'laptop'));
  $('other').addEventListener('click', () => input.click());

  render();
}
</script>
</body>
</html>
